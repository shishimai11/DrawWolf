<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf Ver.0.5</title>

<style>

body{
font-family:sans-serif;
text-align:center;
background:linear-gradient(135deg,#0f172a,#334155);
color:white;
padding:20px;
}

h1{
font-size:42px;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:25px;
margin:20px auto;
max-width:420px;
box-shadow:0 0 20px #0007;
}


button{
font-size:20px;
padding:15px 25px;
border-radius:20px;
border:none;
margin:10px;
background:#2563eb;
color:white;
cursor:pointer;
}


button:hover{
transform:scale(1.05);
}


input,select{
font-size:20px;
padding:10px;
border-radius:10px;
}


.card{

font-size:30px;
font-weight:bold;

}


.vote button{

display:block;
width:80%;
margin:10px auto;

}


</style>

</head>


<body>


<h1>🐺 Draw Wolf</h1>


<div class="box" id="setting">

<h2>🎮 ゲーム設定</h2>


<p>人数</p>
<input id="players" type="number" value="5" min="3" max="10">


<p>狼の人数</p>
<input id="wolves" type="number" value="1" min="1" max="3">


<p>難易度</p>

<select id="level">

<option value="easy">
⭐普通
</option>

<option value="hard">
⭐⭐難しい
</option>

<option value="wolf">
⭐⭐⭐鬼
</option>

</select>


<br>


<button onclick="startGame()">
🔥 ゲーム開始
</button>


</div>




<div class="box" id="game" style="display:none;">


<h2 id="player">
1番の人
</h2>


<button onclick="showTopic()">
👁️ お題を見る
</button>


<div id="topic" class="box" style="display:none;">

</div>


<button onclick="hideTopic()">
🙈 隠す
</button>


<br>


<button onclick="nextPlayer()">
➡️ 次の人へ
</button>


</div>




<div class="box" id="vote" style="display:none;">

<h2>🗳️ 投票</h2>

<p>
怪しい人を選んでください
</p>


<div id="voteArea" class="vote">

</div>


</div>




<div class="box" id="result" style="display:none;">

<h1 id="resultText"></h1>


<button onclick="restart()">
🔄 もう一回遊ぶ
</button>


</div><script>

let playerCount;
let wolfCount;

let nowPlayer = 1;

let wolfPlayers = [];

let citizenTopic;
let wolfTopic;

let votedPlayer;


// お題データ

let topics = [

["修学旅行🚌","林間学校🌲"],
["体育祭🏃","文化祭🎭"],
["遊園地🎢","水族館🐬"],
["東京タワー🗼","スカイツリー🏙️"],
["海水浴🏖️","プール🏊"],
["映画館🎬","カラオケ🎤"],
["動物園🦁","水族館🐟"],
["キャンプ⛺","バーベキュー🍖"],
["ホテル🏨","旅館🏯"],
["初詣⛩️","花火大会🎆"]

];


let hardTopics = [

["ディズニーランド🏰","USJ🎢"],
["卒業式🎓","入学式🌸"],
["駅🚉","空港✈️"],
["病院🏥","薬局💊"],
["図書館📚","本屋📖"],
["スキー場⛷️","スケート場⛸️"],
["温泉♨️","銭湯🛁"],
["結婚式💍","成人式🎉"]

];


let wolfTopics = [

["エッフェル塔🗼","自由の女神🗽"],
["宇宙旅行🚀","深海探検🌊"],
["オリンピック🏅","世界大会🌎"],
["遊園地🎡","テーマパーク🎠"]

];



function startGame(){


playerCount =
Number(document.getElementById("players").value);


wolfCount =
Number(document.getElementById("wolves").value);



let level =
document.getElementById("level").value;



let list = topics;


if(level=="hard"){

list=hardTopics;

}


if(level=="wolf"){

list=wolfTopics;

}



let pair =
list[Math.floor(Math.random()*list.length)];



citizenTopic=pair[0];

wolfTopic=pair[1];



wolfPlayers=[];



while(wolfPlayers.length<wolfCount){


let n=Math.floor(Math.random()*playerCount)+1;


if(!wolfPlayers.includes(n)){

wolfPlayers.push(n);

}


}



document.getElementById("setting").style.display="none";

document.getElementById("game").style.display="block";


}




function showTopic(){


let topic;



if(wolfPlayers.includes(nowPlayer)){


topic=wolfTopic;


}else{


topic=citizenTopic;


}



document.getElementById("topic").style.display="block";


document.getElementById("topic").innerHTML=

`
<div class="card">
あなたのお題<br><br>
${topic}
</div>
`;

}




function hideTopic(){

document.getElementById("topic").style.display="none";

}




function nextPlayer(){


nowPlayer++;

hideTopic();



if(nowPlayer<=playerCount){


document.getElementById("player").innerHTML=

nowPlayer+"番の人";


}else{


document.getElementById("game").style.display="none";


showVote();


}


}




function showVote(){


document.getElementById("vote").style.display="block";


let area=document.getElementById("voteArea");


area.innerHTML="";



for(let i=1;i<=playerCount;i++){


let btn=document.createElement("button");


btn.innerHTML=i+"番";


btn.onclick=function(){

checkVote(i);

};


area.appendChild(btn);


}


}




function checkVote(player){


votedPlayer=player;


document.getElementById("vote").style.display="none";


document.getElementById("result").style.display="block";



if(wolfPlayers.includes(player)){


document.getElementById("resultText").innerHTML=

"🎉 市民チーム勝利！<br>🐺 狼を見つけた！";


}else{


document.getElementById("resultText").innerHTML=

"🐺 狼チーム勝利！<br>逃げ切った！";


}


}





function restart(){


location.reload();


}



</script>


</body>

</html>
