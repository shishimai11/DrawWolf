<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf</title>

<style>

body{
font-family:sans-serif;
text-align:center;
background:linear-gradient(135deg,#020617,#312e81);
color:white;
padding:15px;
}

h1{
font-size:48px;
}


.box{
background:white;
color:black;
padding:25px;
border-radius:30px;
margin:20px auto;
max-width:450px;
box-shadow:0 0 25px #0008;
}


button{
font-size:22px;
padding:18px 30px;
border-radius:25px;
border:none;
margin:10px;
background:#2563eb;
color:white;
}


input,select{
font-size:18px;
padding:12px;
border-radius:12px;
width:85%;
margin:5px;
}


.hidden{
display:none;
}


.info{
font-size:22px;
font-weight:bold;
}


#names input{
display:block;
}


.card{

height:190px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:bold;
cursor:pointer;

}


</style>

</head>


<body>


<div id="title">

<h1>🐺 Draw Wolf</h1>

<p>
究極のワードウルフゲーム
</p>


<div class="box">

<button onclick="showSetting()">
🎮 ゲーム開始
</button>


<button onclick="showRule()">
📖 遊び方
</button>


<button onclick="showRecord()">
🏆 戦績
</button>


</div>

</div>



<div class="box hidden" id="rule">

<h2>📖 遊び方</h2>

<p>
1人だけ違うお題を持つ狼を探そう！
</p>

<p>
話し合って狼を投票！
</p>


<button onclick="backMenu()">
戻る
</button>

</div>





<div class="box hidden" id="setting">

<h2>🎮 設定</h2>


<p>人数</p>

<input id="players"
type="number"
value="5"
min="3"
max="20"
onchange="createNames()">



<h3>👤 名前</h3>

<div id="names"></div>



<p>🐺 狼人数</p>

<input id="wolves"
type="number"
value="1"
min="1"
max="5">



<p>🎯 ジャンル</p>

<select id="genre">

<option value="全部">全部</option>
<option value="学校">学校</option>
<option value="場所">場所</option>
<option value="行事">行事</option>
<option value="食べ物">食べ物</option>
<option value="遊び">遊び</option>

</select>


<br>

<button onclick="startGame()">
🔥 スタート
</button>


<button onclick="backMenu()">
戻る
</button>


</div>





<div class="box hidden" id="game">


<h2 id="player"></h2>


<p id="progress" class="info"></p>


<p>
📱スマホを自分だけに向けてね
</p>


<div class="box card" id="topicBox" onclick="showTopic()">

🎴 タップしてお題を見る

</div>



<button onclick="hideTopic()">

🙈 隠す

</button>


<button onclick="nextPlayer()">

➡️ 次の人へ

</button>


</div><div class="box hidden" id="vote">

<h2>🗳️ 投票</h2>

<p>狼だと思う人を選んでください</p>

<div id="voteArea"></div>

<button onclick="finishVote()">
✅ 決定
</button>

</div>



<div class="box hidden" id="result">

<h1 id="resultText"></h1>

<p id="answer"></p>

<button onclick="backMenu()">
🏠 メニューへ
</button>

</div>



<script>

let playerCount=0;
let wolfCount=0;

let nowPlayer=0;

let playerNames=[];

let wolfPlayers=[];

let citizenTopic="";
let wolfTopic="";

let selectedVotes=[];



let record={
play:0,
citizen:0,
wolf:0
};


if(localStorage.drawWolfRecord){

record=
JSON.parse(localStorage.drawWolfRecord);

}



// お題

let topics={


"学校":[

["体育祭🏃","文化祭🎭"],
["修学旅行🚌","校外学習🎒"],
["卒業式🎓","入学式🌸"],
["給食🍚","お弁当🍱"]

],


"場所":[

["遊園地🎢","水族館🐬"],
["動物園🦁","サファリパーク🐯"],
["駅🚉","空港✈️"],
["映画館🎬","劇場🎭"]

],


"行事":[

["夏祭り🎆","花火大会🎇"],
["クリスマス🎄","ハロウィン🎃"],
["誕生日会🎂","歓迎会🎉"]

],


"食べ物":[

["ラーメン🍜","うどん🍲"],
["寿司🍣","焼肉🥩"],
["カレー🍛","シチュー🥘"]

],


"遊び":[

["ゲーム🎮","スポーツ⚽"],
["カラオケ🎤","映画🎬"],
["ボードゲーム🎲","カードゲーム🃏"]

]


};





function createNames(){


let area=document.getElementById("names");

let num=
Number(document.getElementById("players").value);


area.innerHTML="";


for(let i=1;i<=num;i++){


let input=document.createElement("input");

input.id="name"+i;

input.placeholder=i+"番 名前";


area.appendChild(input);

}


}


createNames();





function hideAll(){


document.querySelectorAll(".box")
.forEach(e=>{

e.classList.add("hidden");

});


document.getElementById("title")
.style.display="none";


}





function showSetting(){

hideAll();

document.getElementById("setting")
.classList.remove("hidden");

}



function showRule(){

hideAll();

document.getElementById("rule")
.classList.remove("hidden");

}



function showRecord(){

hideAll();

document.getElementById("record")
.classList.remove("hidden");


document.getElementById("recordText").innerHTML=

`
プレイ回数：${record.play}<br>
市民勝利：${record.citizen}<br>
狼勝利：${record.wolf}
`;

}





function backMenu(){


hideAll();


document.getElementById("title")
.style.display="block";


}





function startGame(){


playerCount=
Number(document.getElementById("players").value);


wolfCount=
Number(document.getElementById("wolves").value);



playerNames=[];



for(let i=1;i<=playerCount;i++){


let name=
document.getElementById("name"+i).value;


if(name==""){

name=i+"番";

}


playerNames.push(name);


}





let genre=
document.getElementById("genre").value;


let list=[];



if(genre=="全部"){


Object.values(topics)
.forEach(x=>{

list=list.concat(x);

});


}else{


list=topics[genre];


}



let pair=
list[Math.floor(Math.random()*list.length)];



citizenTopic=pair[0];

wolfTopic=pair[1];





wolfPlayers=[];


while(wolfPlayers.length<wolfCount){


let n=
Math.floor(Math.random()*playerCount);


if(!wolfPlayers.includes(n)){

wolfPlayers.push(n);

}


}





record.play++;

saveRecord();



nowPlayer=0;


hideAll();


document.getElementById("game")
.classList.remove("hidden");


updatePlayer();


}





function updatePlayer(){


document.getElementById("player").innerHTML=

"👤 "+playerNames[nowPlayer];


document.getElementById("progress").innerHTML=

"確認 "+(nowPlayer+1)+" / "+playerCount;


}





function showTopic(){


let topic;


if(wolfPlayers.includes(nowPlayer)){


topic=wolfTopic;


}else{


topic=citizenTopic;


}



document.getElementById("topicBox")
.innerHTML=

`
${playerNames[nowPlayer]}さんのお題
<br><br>
<h2>${topic}</h2>
`;

}




function hideTopic(){


document.getElementById("topicBox")
.innerHTML=

"🎴 タップしてお題を見る";


}




function nextPlayer(){


nowPlayer++;


hideTopic();



if(nowPlayer<playerCount){


updatePlayer();


}else{


hideAll();


document.getElementById("vote")
.classList.remove("hidden");


showVote();


}


}





function showVote(){


let area=
document.getElementById("voteArea");


area.innerHTML="";


selectedVotes=[];



for(let i=0;i<playerCount;i++){


let btn=document.createElement("button");


btn.innerHTML=playerNames[i];


btn.onclick=function(){


if(selectedVotes.includes(i)){


selectedVotes=
selectedVotes.filter(x=>x!=i);


btn.style.background="#2563eb";


}else{


selectedVotes.push(i);

btn.style.background="#dc2626";


}


};


area.appendChild(btn);


}


}





function finishVote(){


let win=true;



if(selectedVotes.length!=wolfPlayers.length){

win=false;

}




for(let w of wolfPlayers){


if(!selectedVotes.includes(w)){

win=false;

}


}




if(win){

record.citizen++;

}else{

record.wolf++;

}


saveRecord();



hideAll();


document.getElementById("result")
.classList.remove("hidden");



document.getElementById("resultText")
.innerHTML=

win?

"🎉 市民チーム勝利！"

:

"🐺 狼チーム勝利！";



document.getElementById("answer")
.innerHTML=

"🐺 狼："+wolfPlayers.map(x=>playerNames[x]).join(" ");

}





function saveRecord(){

localStorage.drawWolfRecord=
JSON.stringify(record);

}


</script>


</body>

</html>
