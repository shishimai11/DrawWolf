<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Wolf</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🐺 Draw Wolf</h1>
  <p>一筆人狼ゲーム</p>

  <div class="card">

    <label>人数</label>

    <select id="playerCount">
      <option>3</option>
      <option>4</option>
      <option selected>5</option>
      <option>6</option>
      <option>7</option>
      <option>8</option>
      <option>9</option>
      <option>10</option>
    </select>

    <label>人狼</label>

    <select id="wolfCount">
      <option selected>1</option>
      <option>2</option>
      <option>3</option>
    </select>

    <button id="startBtn">
      ゲーム開始
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
