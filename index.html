<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

body{
font-family:sans-serif;
text-align:center;
background:linear-gradient(135deg,#020617,#312e81);
color:white;
padding:15px;
}

h1{
font-size:48px;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:30px;
margin:20px auto;
max-width:450px;
box-shadow:0 0 25px #0008;
}

button{
font-size:22px;
padding:18px 30px;
border-radius:25px;
border:none;
margin:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

input,select{
font-size:18px;
padding:12px;
border-radius:12px;
width:85%;
margin:5px;
}

.hidden{
display:none;
}

.info{
font-size:22px;
font-weight:bold;
}

#names input{
display:block;
margin: 8px auto;
}

/* カード */

.card{
height:200px;
perspective:1000px;
cursor:pointer;
}

.cardInner{
height:100%;
transition:.6s;
transform-style:preserve-3d;
}

.card.flip .cardInner{
transform:rotateY(180deg);
}

.cardFront,
.cardBack{
position:relative;
width:100%;
height:200px;

display:flex;
align-items:center;
justify-content:center;

border-radius:25px;

font-size:28px;
font-weight:bold;

backface-visibility:hidden;
}

.cardFront{
position:absolute;
background:#2563eb;
color:white;
}

.cardBack{
background:white;
color:black;
transform:rotateY(180deg);
}

</style>

</head>

<body>

<div id="title">

<h1>🐺 Draw Wolf</h1>

<p>
究極のワードウルフゲーム
</p>

<div class="box">

<button onclick="showSetting()">
🎮 ゲーム開始
</button>

<br>

<button onclick="showRule()">
📖 遊び方
</button>

<br>

<button onclick="showRecord()">
🏆 戦績
</button>

</div>

</div>

<div class="box hidden" id="rule">

<h2>📖 遊び方</h2>

<p>
1人だけ違うお題を持つ狼を探そう！
</p>

<p>
話し合って投票して狼を当てよう！
</p>

<button onclick="backMenu()">
戻る
</button>

</div>

<div class="box hidden" id="record">

<h2>🏆 戦績</h2>

<p id="recordText">
読み込み中...
</p>

<button onclick="backMenu()">
戻る
</button>

</div>

<div class="box hidden" id="setting">

<h2>🎮 ゲーム設定</h2>

<p>人数</p>

<input id="players"
type="number"
value="5"
min="3"
max="20"
onchange="createNames()">

<h3>👤 名前</h3>

<div id="names"></div>

<p>🐺 狼人数</p>

<input id="wolves"
type="number"
value="1"
min="1"
max="5">

<p>🔥 難易度</p>

<select id="difficulty">

<option value="normal">
⭐ 普通
</option>

<option value="hard">
⭐⭐ 難しい
</option>

<option value="hell">
⭐⭐⭐ 鬼
</option>

</select>

<br>

<button onclick="startGame()">
🔥 スタート
</button>

<button onclick="backMenu()">
戻る
</button>

</div>

<div class="box hidden" id="game">

<h2 id="player"></h2>

<p id="progress" class="info"></p>

<p>
📱スマホを自分だけに向けてね
</p>

<div class="card" id="topicCard" onclick="showTopic()">

<div class="cardInner">

<div class="cardFront">
🎴 タップして確認
</div>

<div class="cardBack" id="topic">
</div>

</div>

</div>

<button onclick="hideTopic()">
🙈 隠す
</button>

<button onclick="nextPlayer()">
➡️ 次の人へ
</button>

</div>

<div class="box hidden" id="vote">

<h2>🗳️ 投票</h2>

<p>狼だと思う人を選んでください</p>

<div id="voteArea"></div>

<button onclick="finishVote()">
✅ 決定
</button>

</div>

<div class="box hidden" id="result">

<h1 id="resultText"></h1>

<p id="answer"></p>

<button onclick="backMenu()">
🏠 メニューへ
</button>

</div>

<script>

let playerCount=0;
let wolfCount=0;
let nowPlayer=0;
let playerNames=[];
let wolfPlayers=[];
let citizenTopic="";
let wolfTopic="";
let selectedVotes=[];
let hideTimer=null;

let record={
play:0,
citizen:0,
wolf:0
};

if(localStorage.drawWolfRecord){
record=JSON.parse(localStorage.drawWolfRecord);
}

// ⭐難易度別お題（大幅追加！）
let topics={

normal:[
["犬🐶","猫🐱"],
["夏☀️","冬❄️"],
["海🏖️","プール🏊"],
["映画🎬","ドラマ📺"],
["サッカー⚽","野球⚾"],
["ラーメン🍜","うどん🍜"],
["りんご🍎","バナナ🍌"],
["カフェ☕","ファミレス🍔"],
["山⛰️","川🌊"],
["スマホ📱","パソコン💻"],
["きのこの山🍄","たけのこの里🎋"],
["パン🍞","ご飯🍚"]
],

hard:[
["体育祭🏃","文化祭🎭"],
["修学旅行🚌","林間学校🌲"],
["遊園地🎢","水族館🐬"],
["温泉♨️","銭湯🛁"],
["駅🚉","空港✈️"],
["コンビニ🏪","スーパー🛒"],
["焼肉🥩","しゃぶしゃぶ🍲"],
["ボウリング🎳","カラオケ🎤"],
["映画館🍿","劇場🎭"],
["公園🌳","広場🏟️"]
],

hell:[
["ディズニーランド🏰","USJ🎢"],
["卒業式🎓","入学式🌸"],
["キャンプ⛺","バーベキュー🍖"],
["図書館📚","本屋📖"],
["ホテル🏨","旅館🏯"],
["マクドナルド🍔","モスバーガー🍔"],
["ポテトチップス🥔","ポップコーン🍿"],
["ハンバーグ🥩","ステーキ🥩"],
["かき氷🍧","アイスクリーム🍦"]
]

};

function createNames(){
let area=document.getElementById("names");
let num=Number(document.getElementById("players").value);

area.innerHTML="";

for(let i=1;i<=num;i++){
let input=document.createElement("input");
input.id="name"+i;
input.value=i+"番";
area.appendChild(input);
}
}

createNames();

function hideAll(){
document.querySelectorAll(".box").forEach(e=>{
e.classList.add("hidden");
});

document.getElementById("title").style.display="none";
}

function showSetting(){
hideAll();
document.getElementById("setting").classList.remove("hidden");
}

function showRule(){
hideAll();
document.getElementById("rule").classList.remove("hidden");
}

function showRecord(){
hideAll();
document.getElementById("record").classList.remove("hidden");

document.getElementById("recordText").innerHTML=
`
プレイ回数：${record.play}<br>
市民勝利：${record.citizen}<br>
狼勝利：${record.wolf}
`;
}

function backMenu(){
hideAll();
document.getElementById("title").style.display="block";
}

function startGame(){

playerCount=Number(document.getElementById("players").value);
wolfCount=Number(document.getElementById("wolves").value);

playerNames=[];

for(let i=1;i<=playerCount;i++){
let n=document.getElementById("name"+i).value;
if(n=="") n=i+"番";
playerNames.push(n);
}

let level=document.getElementById("difficulty").value;

let pair=topics[level][Math.floor(Math.random()*topics[level].length)];

if(Math.random() < 0.5){
citizenTopic=pair[0];
wolfTopic=pair[1];
}else{
citizenTopic=pair[1];
wolfTopic=pair[0];
}

wolfPlayers=[];

while(wolfPlayers.length<wolfCount){
let n=Math.floor(Math.random()*playerCount);
if(!wolfPlayers.includes(n)){
wolfPlayers.push(n);
}
}

record.play++;
saveRecord();

nowPlayer=0;

hideAll();
document.getElementById("game").classList.remove("hidden");

updatePlayer();
}

function updatePlayer(){
document.getElementById("player").innerHTML="👤 "+playerNames[nowPlayer];
document.getElementById("progress").innerHTML="確認 "+(nowPlayer+1)+" / "+playerCount;
}

function showTopic(){
if(hideTimer){
clearTimeout(hideTimer);
hideTimer = null;
}

let topic;

if(wolfPlayers.includes(nowPlayer)){
topic=wolfTopic;
}else{
topic=citizenTopic;
}

document.getElementById("topic").innerHTML=
`
${playerNames[nowPlayer]}さんのお題
<br><br>
<h2>${topic}</h2>
`;

document.getElementById("topicCard").classList.add("flip");
}

function hideTopic(){
document.getElementById("topicCard").classList.remove("flip");

if(hideTimer){
clearTimeout(hideTimer);
}

hideTimer = setTimeout(()=>{
document.getElementById("topic").innerHTML="";
hideTimer = null;
},600);
}

function nextPlayer(){
nowPlayer++;
hideTopic();

if(nowPlayer<playerCount){
updatePlayer();
}else{
hideAll();
document.getElementById("vote").classList.remove("hidden");
showVote();
}
}

function showVote(){
let area=document.getElementById("voteArea");
area.innerHTML="";
selectedVotes=[];

for(let i=0;i<playerCount;i++){
let b=document.createElement("button");
b.innerHTML=playerNames[i];

b.onclick=function(){
if(selectedVotes.includes(i)){
selectedVotes=selectedVotes.filter(x=>x!=i);
b.style.background="#2563eb";
}else{
selectedVotes.push(i);
b.style.background="#dc2626";
}
};

area.appendChild(b);
}
}

function finishVote(){
let win=true;

if(selectedVotes.length!=wolfPlayers.length)
win=false;

wolfPlayers.forEach(w=>{
if(!selectedVotes.includes(w))
win=false;
});

if(win)
record.citizen++;
else
record.wolf++;

saveRecord();

hideAll();
document.getElementById("result").classList.remove("hidden");

document.getElementById("resultText").innerHTML=
win? "🎉 市民チーム勝利！" : "🐺 狼チーム勝利！";

document.getElementById("answer").innerHTML=
"🐺 狼："+wolfPlayers.map(x=>playerNames[x]).join(" ");
}

function saveRecord(){
localStorage.drawWolfRecord=JSON.stringify(record);
}

</script>

</body>
</html>
