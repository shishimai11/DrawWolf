<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf</title>

<style>

body{
font-family:sans-serif;
text-align:center;
background:#111827;
color:white;
padding:20px;
}

h1{
font-size:40px;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:20px;
margin:20px;
}

button{
font-size:20px;
padding:15px 25px;
border-radius:15px;
border:none;
margin:10px;
}


input{
font-size:20px;
width:80px;
padding:10px;
}


</style>

</head>


<body>


<h1>🐺 Draw Wolf</h1>


<div class="box" id="setting">

<h2>ゲーム設定</h2>


<p>
人数
</p>

<input id="players" type="number" value="5" min="3" max="10">


<p>
狼の人数
</p>

<input id="wolves" type="number" value="1" min="1" max="3">


<br>


<button onclick="startGame()">
🎮 ゲーム開始
</button>


</div>



<div class="box" id="game" style="display:none;">


<h2 id="player">
1番の人
</h2>


<button onclick="showTopic()">
👁️ お題を見る
</button>


<div id="topic" class="box" style="display:none;">

</div>


<button onclick="nextPlayer()">
➡️ 次の人へ
</button>


</div>
<script>


let playerCount;
let wolfCount;

let nowPlayer = 1;

let wolfPlayers = [];


// お題セット
let topics = [

["サッカー⚽","野球⚾"],
["犬🐶","猫🐱"],
["ラーメン🍜","うどん🍲"],
["海🏖️","プール🏊"],
["夏☀️","冬❄️"],
["コーヒー☕","紅茶🫖"],
["映画🎬","ドラマ📺"],
["自転車🚲","バイク🏍️"],
["学校🏫","塾📚"],
["ゲーム🎮","スマホ📱"]

];


let citizenTopic;
let wolfTopic;



function startGame(){


playerCount =
Number(document.getElementById("players").value);


wolfCount =
Number(document.getElementById("wolves").value);



let pair =
topics[Math.floor(Math.random()*topics.length)];


citizenTopic = pair[0];

wolfTopic = pair[1];



// 狼を決める

wolfPlayers=[];


while(wolfPlayers.length < wolfCount){

let n =
Math.floor(Math.random()*playerCount)+1;


if(!wolfPlayers.includes(n)){

wolfPlayers.push(n);

}

}



document.getElementById("setting").style.display="none";

document.getElementById("game").style.display="block";


}



function showTopic(){


let topic;


if(wolfPlayers.includes(nowPlayer)){

topic = wolfTopic;


}else{


topic = citizenTopic;


}



document.getElementById("topic").style.display="block";


document.getElementById("topic").innerHTML=

"あなたのお題<br><h2>"+topic+"</h2>";

}



function nextPlayer(){


nowPlayer++;


document.getElementById("topic").style.display="none";



if(nowPlayer <= playerCount){


document.getElementById("player").innerHTML=

nowPlayer+"番の人";


}else{


document.getElementById("game").innerHTML=

`

<h1>🎉 全員確認完了！</h1>

<h2>🐺 ゲームスタート！！</h2>

<p>
話し合って狼を見つけよう！
</p>

`;

}


}


</script>


</body>

</html>
