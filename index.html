<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf</title>

<style>

body{
font-family:sans-serif;
text-align:center;
background:linear-gradient(135deg,#020617,#312e81);
color:white;
padding:15px;
}


h1{
font-size:48px;
margin-bottom:5px;
}


.subtitle{
font-size:18px;
}


.box{
background:white;
color:black;
padding:25px;
border-radius:30px;
margin:20px auto;
max-width:450px;
box-shadow:0 0 25px #0008;
}



button{

font-size:22px;
padding:18px 30px;
border-radius:25px;
border:none;
margin:10px;
background:#2563eb;
color:white;

}


input,select{

font-size:18px;
padding:12px;
border-radius:12px;
width:85%;
margin:5px;

}


.menu button{

width:85%;

}



.info{

font-size:20px;
font-weight:bold;

}



#names input{

display:block;

}



.hidden{

display:none;

}


</style>

</head>


<body>


<div id="title">


<h1>🐺 Draw Wolf</h1>

<p class="subtitle">
究極のワードウルフゲーム
</p>


<div class="box menu">


<button onclick="showSetting()">
🎮 ゲーム開始
</button>


<br>


<button onclick="showRule()">
📖 遊び方
</button>


<br>


<button onclick="showRecord()">
🏆 戦績
</button>


</div>


</div>





<div class="box hidden" id="rule">


<h2>📖 遊び方</h2>


<p>

1人だけ違うお題を持つ狼を探そう！

</p>


<p>

話し合って投票！

</p>


<button onclick="backMenu()">

戻る

</button>


</div>






<div class="box hidden" id="setting">


<h2>🎮 設定</h2>


<p>人数</p>


<input id="players" 
type="number"
value="5"
min="3"
max="20"
onchange="createNames()">



<h3>👤 名前</h3>


<div id="names"></div>



<p>🐺 狼人数</p>


<input id="wolves"
type="number"
value="1"
min="1"
max="5">



<p>🎯 ジャンル</p>


<select id="genre">


<option>全部</option>

<option>学校</option>

<option>場所</option>

<option>行事</option>

<option>食べ物</option>

<option>遊び</option>


</select>



<br>


<button onclick="startGame()">

🔥 スタート

</button>


<button onclick="backMenu()">

戻る

</button>


</div>





<div class="box hidden" id="record">


<h2>🏆 戦績</h2>


<p id="recordText">

読み込み中...

</p>


<button onclick="backMenu()">

戻る

</button>


</div><div class="box hidden" id="game">

<h2 id="player"></h2>

<p id="progress" class="info"></p>

<div class="box" id="topicBox" onclick="showTopic()">

🎴 タップしてお題を見る

</div>


<button onclick="hideTopic()">
🙈 隠す
</button>


<button onclick="nextPlayer()">
➡️ 次の人へ
</button>

</div>



<div class="box hidden" id="vote">

<h2>🗳️ 投票</h2>

<p>狼だと思う人を選んでください</p>

<div id="voteArea"></div>


<button onclick="finishVote()">
✅ 決定
</button>

</div>



<div class="box hidden" id="result">

<h1 id="resultText"></h1>

<p id="answer"></p>

<button onclick="backMenu()">
🏠 メニューへ
</button>

</div>




<script>


let playerCount=0;
let wolfCount=0;

let nowPlayer=0;

let playerNames=[];

let wolfPlayers=[];

let citizenTopic="";
let wolfTopic="";

let selectedVotes=[];


// 戦績

let record={

play:0,
citizen:0,
wolf:0

};



if(localStorage.record){

record=JSON.parse(localStorage.record);

}




// お題

let topics={


"学校":[

["体育祭🏃","文化祭🎭"],
["修学旅行🚌","校外学習🎒"],
["卒業式🎓","入学式🌸"]

],


"場所":[

["遊園地🎢","水族館🐬"],
["動物園🦁","サファリパーク🐯"],
["駅🚉","空港✈️"]

],


"行事":[

["夏祭り🎆","花火大会🎇"],
["クリスマス🎄","ハロウィン🎃"]

],


"食べ物":[

["ラーメン🍜","うどん🍲"],
["寿司🍣","焼肉🥩"]

],


"遊び":[

["ゲーム🎮","スポーツ⚽"],
["カラオケ🎤","映画🎬"]

]


};




// 名前作成

function createNames(){


let area=document.getElementById("names");

let num=
Number(document.getElementById("players").value);


area.innerHTML="";


for(let i=1;i<=num;i++){


let input=document.createElement("input");

input.id="name"+i;

input.placeholder=i+"番 名前";


area.appendChild(input);


}


}


createNames();





function showSetting(){

hideAll();

document.getElementById("setting")
.classList.remove("hidden");


}





function showRule(){

hideAll();

document.getElementById("rule")
.classList.remove("hidden");

}





function showRecord(){

hideAll();


document.getElementById("record")
.classList.remove("hidden");


document.getElementById("recordText").innerHTML=

`
プレイ回数：${record.play}<br>
市民勝利：${record.citizen}<br>
狼勝利：${record.wolf}
`;

}




function backMenu(){

hideAll();

document.getElementById("title")
.style.display="block";


}





function hideAll(){


document.querySelectorAll(".box")
.forEach(e=>{

e.classList.add("hidden");

});


document.getElementById("title")
.style.display="none";


}





function startGame(){


playerCount=
Number(document.getElementById("players").value);


wolfCount=
Number(document.getElementById("wolves").value);



playerNames=[];


for(let i=1;i<=playerCount;i++){


let n=document.getElementById("name"+i).value;


if(n==""){

n=i+"番";

}


playerNames.push(n);

}




let genre=
document.getElementById("genre").value;



let list=[];


if(genre=="全部"){


Object.values(topics)
.forEach(x=>{

list=list.concat(x);

});


}else{


list=topics[genre];

}




let pair=
list[Math.floor(Math.random()*list.length)];



citizenTopic=pair[0];

wolfTopic=pair[1];





wolfPlayers=[];



while(wolfPlayers.length<wolfCount){


let n=Math.floor(Math.random()*playerCount);


if(!wolfPlayers.includes(n)){


wolfPlayers.push(n);


}


}




record.play++;

saveRecord();



nowPlayer=0;


hideAll();


document.getElementById("game")
.classList.remove("hidden");


updatePlayer();


}





function updatePlayer(){


document.getElementById("player").innerHTML=

"👤 "+playerNames[nowPlayer];


document.getElementById("progress").innerHTML=

"確認 "+(nowPlayer+1)+" / "+playerCount;


}





function showTopic(){


let topic;


if(wolfPlayers.includes(nowPlayer)){


topic=wolfTopic;


}else{


topic=citizenTopic;


}



document.getElementById("topicBox")
.innerHTML=

playerNames[nowPlayer]+"さんのお題<br><br>"+topic;


}




function hideTopic(){


document.getElementById("topicBox")
.innerHTML=

"🎴 タップしてお題を見る";


}





function nextPlayer(){


nowPlayer++;

hideTopic();



if(nowPlayer<playerCount){


updatePlayer();


}else{


hideAll();


document.getElementById("vote")
.classList.remove("hidden");


showVote();


}


}





function showVote(){


let area=document.getElementById("voteArea");


area.innerHTML="";


selectedVotes=[];


for(let i=0;i<playerCount;i++){


let b=document.createElement("button");


b.innerHTML=playerNames[i];


b.onclick=()=>{


if(selectedVotes.includes(i)){


selectedVotes=
selectedVotes.filter(x=>x!=i);


b.style.background="#2563eb";


}else{


selectedVotes.push(i);

b.style.background="#dc2626";


}


};


area.appendChild(b);


}


}





function finishVote(){


let win=true;



if(selectedVotes.length!=wolfPlayers.length){

win=false;

}



wolfPlayers.forEach(w=>{


if(!selectedVotes.includes(w)){

win=false;

}


});





if(win){


record.citizen++;


}else{


record.wolf++;


}



saveRecord();



hideAll();


document.getElementById("result")
.classList.remove("hidden");



document.getElementById("resultText")
.innerHTML=

win?

"🎉 市民チーム勝利！"

:

"🐺 狼チーム勝利！";



document.getElementById("answer")
.innerHTML=

"🐺 狼："+wolfPlayers.map(x=>playerNames[x]).join(" ");

}





function saveRecord(){

localStorage.record=
JSON.stringify(record);

}



</script>


</body>

</html>
