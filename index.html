<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf Ver.0.4</title>

<style>

body{
font-family:sans-serif;
text-align:center;
background:linear-gradient(135deg,#111827,#374151);
color:white;
padding:20px;
}

h1{
font-size:42px;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:25px;
margin:20px auto;
max-width:400px;
box-shadow:0 0 20px #0005;
}


button{
font-size:20px;
padding:15px 25px;
border-radius:20px;
border:none;
margin:10px;
cursor:pointer;
background:#2563eb;
color:white;
}


button:hover{
transform:scale(1.05);
}


input{
font-size:20px;
width:80px;
padding:10px;
border-radius:10px;
}


#topic{

display:none;
animation:flip 0.5s;

}


.card{

font-size:28px;
font-weight:bold;

}


@keyframes flip{

from{
transform:rotateY(90deg);
}

to{
transform:rotateY(0);
}

}


.timer{

font-size:35px;
font-weight:bold;
color:red;

}


</style>

</head>


<body>


<h1>🐺 Draw Wolf</h1>


<div class="box" id="setting">

<h2>🎮 ゲーム設定</h2>


<p>人数</p>

<input id="players" type="number" value="5" min="3" max="10">


<p>狼の人数</p>

<input id="wolves" type="number" value="1" min="1" max="3">


<br>


<button onclick="startGame()">
🔥 ゲーム開始
</button>


</div>



<div class="box" id="game" style="display:none;">


<h2 id="player">
1番の人
</h2>


<button onclick="showTopic()">
👁️ お題を見る
</button>


<div id="topic" class="box">

</div>


<button onclick="hideTopic()">
🙈 隠す
</button>


<br>


<button onclick="nextPlayer()">
➡️ 次の人へ
</button>


</div>



<div class="box" id="result" style="display:none;">

<h1>🎉 開始！</h1>

<div class="timer" id="timer">
03:00
</div>


<button onclick="startTimer()">
⏱️ タイマースタート
</button>


</div><script>

let playerCount;
let wolfCount;

let nowPlayer = 1;

let wolfPlayers = [];

let citizenTopic;
let wolfTopic;


// 難しいお題セット
let topics = [

["修学旅行🚌","林間学校🌲"],
["体育祭🏃","文化祭🎭"],
["遊園地🎢","水族館🐬"],
["東京タワー🗼","スカイツリー🏙️"],
["海水浴🏖️","プール🏊"],
["映画館🎬","カラオケ🎤"],
["コンビニ🏪","スーパー🛒"],
["動物園🦁","サファリパーク🐯"],
["初詣⛩️","花火大会🎆"],
["キャンプ⛺","バーベキュー🍖"],

["駅🚉","空港✈️"],
["図書館📚","本屋📖"],
["病院🏥","薬局💊"],
["学校祭🏫","地域のお祭り🎪"],
["スキー場⛷️","スケート場⛸️"],
["温泉♨️","銭湯🛁"],
["ホテル🏨","旅館🏯"],
["公園🌳","遊歩道🚶"],
["結婚式💍","卒業式🎓"],
["誕生日会🎂","クリスマス会🎄"],

["スマホ📱","パソコン💻"],
["ゲームセンター🕹️","テーマパーク🎡"],
["図工室🎨","音楽室🎹"],
["体育館🏀","グラウンド⚽"],
["給食🍚","お弁当🍱"],
["朝礼🏫","集会📢"],
["電車🚃","バス🚌"],
["映画撮影🎥","写真撮影📸"],
["旅行✈️","遠足🎒"],
["雪祭り❄️","イルミネーション✨"]

];



function startGame(){

playerCount =
Number(document.getElementById("players").value);

wolfCount =
Number(document.getElementById("wolves").value);



let pair =
topics[Math.floor(Math.random()*topics.length)];


citizenTopic = pair[0];

wolfTopic = pair[1];



wolfPlayers=[];


while(wolfPlayers.length < wolfCount){

let n =
Math.floor(Math.random()*playerCount)+1;


if(!wolfPlayers.includes(n)){

wolfPlayers.push(n);

}

}



document.getElementById("setting").style.display="none";

document.getElementById("game").style.display="block";

}




function showTopic(){


let topic;


if(wolfPlayers.includes(nowPlayer)){

topic = wolfTopic;

}else{

topic = citizenTopic;

}



document.getElementById("topic").style.display="block";


document.getElementById("topic").innerHTML=

`
<div class="card">
あなたのお題<br><br>
${topic}
</div>
`;

}




function hideTopic(){

document.getElementById("topic").style.display="none";

}



function nextPlayer(){

nowPlayer++;

hideTopic();


if(nowPlayer <= playerCount){

document.getElementById("player").innerHTML=

nowPlayer+"番の人";


}else{


document.getElementById("game").style.display="none";

document.getElementById("result").style.display="block";


}

}




let time = 180;

let timerId;



function startTimer(){

timerId=setInterval(()=>{


let min=Math.floor(time/60);

let sec=time%60;


document.getElementById("timer").innerHTML=

String(min).padStart(2,"0")+":"+
String(sec).padStart(2,"0");


time--;


if(time<0){

clearInterval(timerId);

alert("投票タイム！🐺");

}


},1000);


}


</script>


</body>

</html>
