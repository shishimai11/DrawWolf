<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf Ver.0.9.1</title>

<style>

body{
font-family:sans-serif;
text-align:center;
background:linear-gradient(135deg,#020617,#334155);
color:white;
padding:15px;
}


h1{
font-size:40px;
}


.box{
background:white;
color:black;
padding:25px;
border-radius:25px;
margin:15px auto;
max-width:450px;
box-shadow:0 0 20px #0008;
}


button{
font-size:22px;
padding:18px 30px;
border-radius:25px;
border:none;
margin:10px;
background:#2563eb;
color:white;
}


input,select{
font-size:18px;
padding:12px;
border-radius:12px;
width:85%;
margin:5px;
}


.info{
font-size:22px;
font-weight:bold;
}


.card{
height:190px;
perspective:1000px;
cursor:pointer;
}


.cardInner{
height:100%;
transition:.6s;
transform-style:preserve-3d;
}


.card.flip .cardInner{
transform:rotateY(180deg);
}


.cardFront,
.cardBack{

position:absolute;
width:100%;
height:190px;
display:flex;
align-items:center;
justify-content:center;
border-radius:25px;
backface-visibility:hidden;
font-size:28px;
font-weight:bold;

}


.cardFront{

background:#1d4ed8;
color:white;

}


.cardBack{

background:white;
color:black;
transform:rotateY(180deg);

}


.notice{

background:#facc15;
color:black;
padding:15px;
border-radius:15px;
font-weight:bold;

}


.vote button{

display:block;
width:90%;
margin:10px auto;

}


.selected{

background:#dc2626;

}


#names input{

display:block;

}


</style>

</head>


<body>


<h1>🐺 Draw Wolf</h1>


<div class="box" id="setting">

<h2>🎮 ゲーム設定</h2>


<p>人数</p>

<input id="players" type="number" value="5" min="3" max="20" onchange="createNames()">



<h3>👤 プレイヤー名</h3>


<div id="names"></div>


<p>🐺 狼の人数</p>

<input id="wolves" type="number" value="1" min="1" max="5">


<br>


<button onclick="startGame()">

🔥 ゲーム開始

</button>


</div>



<div class="box" id="game" style="display:none;">


<h2 id="player"></h2>


<div class="notice">

📱 スマホを自分だけに向けてね

</div>


<p id="progress" class="info"></p>


<div id="topicCard" class="card" onclick="flipCard()">


<div class="cardInner">


<div class="cardFront">

🎴 タップして確認

</div>


<div class="cardBack" id="topic">

</div>


</div>

</div>


<button onclick="hideTopic()">

🙈 隠す

</button>


<br>


<button onclick="nextPlayer()">

➡️ 次の人へ

</button>


</div><div class="box" id="vote" style="display:none;">

<h2>🗳️ 投票</h2>

<p>狼だと思う人を選んでください</p>

<div id="voteArea" class="vote"></div>

<button onclick="finishVote()">
✅ 決定
</button>

</div>



<div class="box" id="result" style="display:none;">

<h1 id="resultText"></h1>

<p id="answer"></p>

<button onclick="restart()">
🔄 もう一回遊ぶ
</button>

</div>



<script>

let playerCount;
let wolfCount;

let nowPlayer=0;

let playerNames=[];

let wolfPlayers=[];

let citizenTopic;
let wolfTopic;

let selectedVotes=[];



let topics=[

["修学旅行🚌","林間学校🌲"],
["体育祭🏃","文化祭🎭"],
["遊園地🎢","水族館🐬"],
["動物園🦁","サファリパーク🐯"],
["海水浴🏖️","プール🏊"],
["映画館🎬","カラオケ🎤"],
["温泉♨️","銭湯🛁"],
["ホテル🏨","旅館🏯"],
["駅🚉","空港✈️"],
["図書館📚","本屋📖"],
["卒業式🎓","入学式🌸"],
["ディズニーランド🏰","USJ🎢"],
["キャンプ⛺","バーベキュー🍖"],
["花火大会🎆","夏祭り🎪"]

];




// 名前欄作成

function createNames(){

let area=document.getElementById("names");

let num=
Number(document.getElementById("players").value);


area.innerHTML="";


for(let i=1;i<=num;i++){

let input=document.createElement("input");

input.id="name"+i;

input.placeholder=i+"番の名前";

area.appendChild(input);

}

}


createNames();





function startGame(){


playerCount=
Number(document.getElementById("players").value);


wolfCount=
Number(document.getElementById("wolves").value);



playerNames=[];


for(let i=1;i<=playerCount;i++){


let name=
document.getElementById("name"+i).value;


if(name==""){

name=i+"番";

}


playerNames.push(name);

}




let pair=
topics[Math.floor(Math.random()*topics.length)];


citizenTopic=pair[0];

wolfTopic=pair[1];




wolfPlayers=[];



while(wolfPlayers.length<wolfCount){


let n=
Math.floor(Math.random()*playerCount);


if(!wolfPlayers.includes(n)){

wolfPlayers.push(n);

}

}




nowPlayer=0;


document.getElementById("setting").style.display="none";

document.getElementById("game").style.display="block";


updatePlayer();


}




function updatePlayer(){


document.getElementById("player").innerHTML=

"👤 "+playerNames[nowPlayer];


document.getElementById("progress").innerHTML=

"確認 "+(nowPlayer+1)+" / "+playerCount;


}




function flipCard(){


let card=
document.getElementById("topicCard");


card.classList.add("flip");



let topic;


if(wolfPlayers.includes(nowPlayer)){

topic=wolfTopic;

}else{

topic=citizenTopic;

}



document.getElementById("topic").innerHTML=

playerNames[nowPlayer]+"さんのお題<br><br>"+topic;


}




function hideTopic(){


document.getElementById("topicCard")
.classList.remove("flip");


document.getElementById("topic").innerHTML="";


}




function nextPlayer(){


nowPlayer++;


hideTopic();



if(nowPlayer<playerCount){

updatePlayer();


}else{


document.getElementById("game").style.display="none";

showVote();


}


}





function showVote(){


document.getElementById("vote").style.display="block";


let area=
document.getElementById("voteArea");


area.innerHTML="";


selectedVotes=[];



for(let i=0;i<playerCount;i++){


let button=document.createElement("button");


button.innerHTML=playerNames[i];


button.onclick=function(){

selectVote(i,button);

};


area.appendChild(button);


}


}





function selectVote(i,button){


if(selectedVotes.includes(i)){


selectedVotes=
selectedVotes.filter(x=>x!=i);


button.classList.remove("selected");


}else{


selectedVotes.push(i);

button.classList.add("selected");


}


}





function finishVote(){


let win=true;



if(selectedVotes.length!=wolfPlayers.length){

win=false;

}



for(let w of wolfPlayers){


if(!selectedVotes.includes(w)){

win=false;

}


}




document.getElementById("vote").style.display="none";

document.getElementById("result").style.display="block";



if(win){

document.getElementById("resultText").innerHTML=

"🎉 市民チーム勝利！";


}else{

document.getElementById("resultText").innerHTML=

"🐺 狼チーム勝利！";


}



let wolves="";


for(let w of wolfPlayers){

wolves+=playerNames[w]+" ";

}



document.getElementById("answer").innerHTML=

"🐺 狼は "+wolves+"でした";


}




function restart(){

location.reload();

}


</script>


</body>

</html>
