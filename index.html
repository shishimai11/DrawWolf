<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Wolf</title>

<style>

body{
  font-family:sans-serif;
  text-align:center;
  background:#111827;
  color:white;
  padding:30px;
}

button{
  font-size:20px;
  padding:15px 30px;
  border-radius:15px;
  border:none;
  margin:10px;
}

.card{
  background:white;
  color:black;
  padding:30px;
  border-radius:20px;
  margin-top:30px;
}

h1{
  font-size:40px;
}

</style>

</head>


<body>

<h1>🐺 Draw Wolf</h1>

<div id="game">

<h2 id="player">
1番の人
</h2>


<button onclick="showTopic()">
👁️ お題を見る
</button>


<div class="card" id="topic" style="display:none;">
</div>


<button onclick="nextPlayer()">
➡️ 次の人へ
</button>


</div>



<script>


let players = 5;

let now = 1;


// お題リスト
let topics=[

"サッカー⚽",

"野球⚾",

"ラーメン🍜",

"うどん🍲",

"犬🐶",

"猫🐱",

"海🏖️",

"プール🏊"

];


function showTopic(){


let topic =
topics[Math.floor(Math.random()*topics.length)];


document.getElementById("topic").style.display="block";


document.getElementById("topic").innerHTML =

"あなたのお題<br><h2>"+topic+"</h2>";


}



function nextPlayer(){


now++;


document.getElementById("topic").style.display="none";



if(now <= players){


document.getElementById("player").innerHTML =

now+"番の人";


}else{


document.getElementById("game").innerHTML =

`
<h1>🎉 全員確認完了！</h1>

<h2>🐺 ゲームスタート！！</h2>

<p>みんなで話し合って狼を探そう！</p>
`;


}


}



</script>


</body>

</html>
